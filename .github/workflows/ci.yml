name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read


# CLAUDE.md §134 — the required PR gate, in order.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: globalcomm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d globalcomm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URI: postgres://postgres:postgres@localhost:5432/globalcomm_test
      PAYLOAD_SECRET: ci-secret-not-for-production-0000000000
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      PREVIEW_SECRET: ci-preview-secret
      MCP_ENABLED: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate environment
        run: pnpm run verify:env

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run migrations
        run: pnpm run migrate

      - name: Unit tests
        run: pnpm run test:unit

      - name: Integration tests
        run: pnpm run test:int

      - name: MCP contract tests
        run: pnpm run test:contract

      # The integration specs publish their own fixtures — clients and services
      # named `<label> ${Date.now()}` — and leave them behind. Those are real
      # published, locale-approved records, so the Services experience band and
      # the work archive's filters render them, with a different timestamp on
      # every run. That made two templates impossible to baseline. The E2E
      # database is rebuilt from the seed alone so the build sees only content
      # this workflow put there.
      - name: Reset the database before building the E2E fixture
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres \
            -c 'DROP DATABASE IF EXISTS globalcomm_test WITH (FORCE);'
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres \
            -c 'CREATE DATABASE globalcomm_test;'

      - name: Run migrations on the rebuilt database
        run: pnpm run migrate

      # The public routes are prerendered during the production build. Seed the
      # published fixtures before building so E2E exercises the real templates
      # instead of build-time 404 output.
      - name: Seed published content for build and E2E
        run: pnpm run seed -- --publish

      - name: Consolidate public service pillars
        run: pnpm run services:consolidate -- --apply

      - name: Seed service pillar copy
        run: pnpm exec tsx scripts/seed-pillar-copy.ts --apply

      # The base seed writes the hero and the CTAs only. Without this step the
      # homepage renders as a hero, an empty blue band and a footer, and the
      # visual baseline records that as the approved page.
      - name: Seed approved homepage copy
        run: pnpm run seed:homepage -- --apply

      - name: Generate service redirects and localized pillar slugs
        run: pnpm run redirects:generate -- --apply

      - name: Verify redirect manifest is current
        run: git diff --exit-code -- tests/fixtures/redirects.json

      - name: Seed deterministic E2E fixture
        run: pnpm exec tsx scripts/seed-e2e.ts

      # Real, source-backed content for the visual baselines. Runs after the
      # other seeds because it is the one that sets
      # `services-page.featuredProjects`, and last writer wins.
      - name: Seed approved visual reference projects
        run: pnpm exec tsx scripts/seed-visual-reference-projects.ts

      - name: Production build
        run: pnpm run build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # E2E includes the visual baseline spec, which compares against the
      # snapshots committed to the branch. Nothing here regenerates them: a
      # baseline that rewrites itself on the run it is checked against cannot
      # fail, and proves nothing. Refresh deliberately, by running
      # `pnpm run test:visual:update` and committing the result for review.
      - name: E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
