name: CI

on:
  pull_request:
  push:
    branches: [main]


# CLAUDE.md §134 — the required PR gate, in order.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: globalcomm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d globalcomm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URI: postgres://postgres:postgres@localhost:5432/globalcomm_test
      PAYLOAD_SECRET: ci-secret-not-for-production-0000000000
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      PREVIEW_SECRET: ci-preview-secret
      MCP_ENABLED: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate environment
        run: pnpm run verify:env

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run migrations
        run: pnpm run migrate

      - name: Unit tests
        run: pnpm run test:unit

      - name: Integration tests
        run: pnpm run test:int

      - name: MCP contract tests
        run: pnpm run test:contract

      # The public routes are prerendered during the production build. Seed the
      # published fixtures before building so E2E exercises the real templates
      # instead of build-time 404 output.
      - name: Seed published content for build and E2E
        run: pnpm run seed -- --publish

      - name: Consolidate public service pillars
        run: pnpm run services:consolidate -- --apply

      - name: Seed service pillar copy
        run: pnpm exec tsx scripts/seed-pillar-copy.ts --apply

      - name: Generate service redirects and localized pillar slugs
        run: pnpm run redirects:generate -- --apply

      - name: Verify redirect manifest is current
        run: git diff --exit-code -- tests/fixtures/redirects.json

      - name: Seed deterministic E2E fixture
        run: pnpm exec tsx scripts/seed-e2e.ts

      - name: Production build
        run: pnpm run build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
